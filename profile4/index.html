        // Show active section and hide others
        document.querySelectorAll('.nav_links a:not(#gasButton)').forEach(link => {
            link.addEventListener('click', (e) => {
                // Remove active class from all sections
                document.querySelectorAll('section.main').forEach(section => {
                    section.classList.remove('active');
                });
                
                // Add active class to target section
                const targetId = link.getAttribute('href').substring(1);
                document.getElementById(targetId).classList.add('active');
                
                // Update active link
                document.querySelectorAll('.nav_links a').forEach(a => a.classList.remove('active'));
                link.classList.add('active');
            });
        });
